# Tests use an in-memory H2 database (in PostgreSQL mode) so they need no running database
spring.datasource.url=jdbc:h2:mem:carservice-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# schema.sql uses a PostgreSQL-only partial index, which H2 does not support
spring.sql.init.mode=never
# Security: same Auth0 settings as the app. Spring only contacts Auth0 when it has to check a real token,
# which the tests never do (they use jwt() test tokens or a mocked JwtDecoder), so tests stay offline.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-8cqhzs6kt6ocflxl.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://workshop-desk-api
app.cors.allowed-origins=http://localhost:4200
