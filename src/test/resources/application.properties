# Tests use an in-memory H2 database (in PostgreSQL mode) so they need no running database
spring.datasource.url=jdbc:h2:mem:carservice-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
api.key=test-key
