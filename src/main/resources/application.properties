spring.application.name=CarService

# Values come from environment variables; the defaults after ":" are for local development only
# (they match docker-compose.yml). On the hosting service, set DB_URL, DB_USER, DB_PASSWORD and ALLOWED_ORIGINS
# (PORT is set by the host; AUTH0_ISSUER and AUTH0_AUDIENCE only if they differ from the defaults below).
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/carservice}
spring.datasource.username=${DB_USER:carservice}
spring.datasource.password=${DB_PASSWORD:carservice}

# PostgreSQL does not create tables by itself (H2 in-memory did): let Hibernate create/update them from the entities
spring.jpa.hibernate.ddl-auto=update
# Run schema.sql (partial unique index on license plates) on every start, after Hibernate's table updates
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true

# Login (OIDC via Auth0): every request needs an access token issued by this Auth0 tenant for this API.
# Spring finds Auth0's public signing keys from the issuer and checks signature, issuer, audience and expiry.
# These values are public (not secrets); the issuer must end with "/" exactly like in the tokens.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER:https://dev-8cqhzs6kt6ocflxl.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://workshop-desk-api}

# Browser origins allowed to call the API (comma-separated), e.g. the deployed frontend's URL
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
