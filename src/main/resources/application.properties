spring.application.name=CarService

# Values come from environment variables; the defaults after ":" are for local development only
# (they match docker-compose.yml). On the hosting service, set DB_URL, DB_USER, DB_PASSWORD, API_KEY and PORT.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/carservice}
spring.datasource.username=${DB_USER:carservice}
spring.datasource.password=${DB_PASSWORD:carservice}

# PostgreSQL does not create tables by itself (H2 in-memory did): let Hibernate create/update them from the entities
spring.jpa.hibernate.ddl-auto=update
# Run schema.sql (partial unique index on license plates) on every start, after Hibernate's table updates
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true

# Temporary until Spring Security + Auth0 replace the API key (backend step 9)
api.key=${API_KEY:local-dev-key}
